<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKA — Оплата</title>
<style>
:root{--wine:#6B0F19;--wine-dark:#4E0A12;--beige:#F3EBDC;--cream:#FBF6EC;--ink:#2A1418;--muted:#8C6F63;--ok:#3B7A4B;
--serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
--shadow:0 22px 50px -30px rgba(42,20,24,.5);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
background:radial-gradient(900px 420px at 80% -10%, rgba(107,15,25,.07), transparent 62%), var(--beige);}
.box{max-width:460px;width:100%;background:var(--cream);border:1px solid rgba(107,15,25,.15);border-radius:22px;
padding:44px 34px;box-shadow:var(--shadow);text-align:center;animation:in .45s ease both;}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.box img{height:56px;margin:0 auto 22px;}
.ic{width:74px;height:74px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:34px;}
.ic--wait{background:rgba(201,162,39,.16);}
.ic--ok{background:rgba(59,122,75,.15);color:var(--ok);}
.ic--no{background:rgba(170,34,34,.12);color:#a12;}
.spin{width:44px;height:44px;border:3px solid rgba(107,15,25,.18);border-top-color:var(--wine);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font-family:var(--serif);font-size:26px;margin-bottom:8px;}
p{color:var(--muted);font-size:14.5px;margin-bottom:22px;}
.a{display:inline-block;background:linear-gradient(160deg,var(--wine),var(--wine-dark));color:var(--cream);
font-weight:700;padding:14px 26px;border-radius:12px;text-decoration:none;transition:.15s;}
.a:hover{filter:brightness(1.08);}
.a2{display:block;margin-top:12px;color:var(--muted);font-size:13.5px;text-decoration:none;}
.a2:hover{color:var(--wine);}
</style>
</head>
<body>
<div class="box">
    <img src="aka-logo-dark.png" alt="AKA">
    <div id="state" aria-live="polite">
        <div class="ic ic--wait"><div class="spin"></div></div>
        <h1>Проверяем оплату…</h1>
        <p>Это займёт несколько секунд.</p>
    </div>
</div>

<script>
const API=(location.protocol==="file:"||location.port==="5500")?"http://localhost:8081":"";
const TOKEN=localStorage.getItem("aka_token");

// номер заказа — только цифры, иначе считаем, что его нет (защита от XSS через ссылку)
const raw=new URLSearchParams(location.search).get("orderId")||sessionStorage.getItem("aka_order");
const orderId=/^\d+$/.test(raw||"")?raw:null;

const PAID_STATUSES=["PAID","DELIVERED"];
const DEADLINE_MS=30000;

/* Вся динамика — через textContent, а не innerHTML */
function render(icon,iconClass,title,text,primary,secondary){
    const box=document.getElementById("state");
    box.innerHTML='<div class="ic"></div><h1></h1><p></p><a class="a"></a><a class="a2"></a>';
    const ic=box.querySelector(".ic"); ic.classList.add(iconClass); ic.textContent=icon;
    box.querySelector("h1").textContent=title;
    box.querySelector("p").textContent=text;
    const a=box.querySelector(".a");  a.textContent=primary.text;   a.href=primary.href;
    const b=box.querySelector(".a2"); b.textContent=secondary.text; b.href=secondary.href;
    history.replaceState(null,"",location.pathname);          // «Назад» не уводит на страницу ЮKassa
}
const toProfile={text:"Мои заказы",href:"profile.html"};
const toShop={text:"Вернуться в магазин",href:"main.html"};

function ok(){
    sessionStorage.removeItem("aka_order");
    render("✓","ic--ok","Заказ оплачен",`Спасибо! Мы уже собираем ваш заказ №${orderId}.`,toProfile,toShop);
}
function pending(){
    sessionStorage.removeItem("aka_order");
    render("⏳","ic--wait","Платёж обрабатывается",
        `Заказ №${orderId} появится в личном кабинете, как только банк подтвердит оплату.`,toProfile,toShop);
}
function fail(text){
    sessionStorage.removeItem("aka_order");
    render("✕","ic--no","Платёж не прошёл",text||"Попробуйте оформить заказ заново.",
        {text:"В корзину",href:"cart.html"},toShop);
}
function goLogin(){
    sessionStorage.setItem("aka_after_login",location.pathname+location.search);
    location.replace("login.html");
}

async function fetchStatus(){
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),8000);                 // таймаут одного запроса
    try{
        return await fetch(API+"/orders/"+encodeURIComponent(orderId)+"/status",
            {headers:{"Authorization":"Bearer "+TOKEN},signal:ctrl.signal});
    }finally{ clearTimeout(t); }
}

async function check(){
    if(!TOKEN){ goLogin(); return; }
    if(!orderId){ fail("Не удалось определить заказ."); return; }

    const deadline=Date.now()+DEADLINE_MS;                     // общий лимит по времени, а не по попыткам
    while(Date.now()<deadline){
        try{
            const r=await fetchStatus();
            if(r.status===401){ localStorage.removeItem("aka_token"); goLogin(); return; }
            if(r.status===403||r.status===404){ fail("Заказ не найден."); return; }
            if(r.ok){
                const {status}=await r.json();
                if(PAID_STATUSES.includes(status)){ ok(); return; }
                if(status==="CANCELLED"){ fail("Платёж отменён."); return; }
            }
        }catch(e){ console.warn("Проверка статуса не удалась:",e); }
        await new Promise(res=>setTimeout(res,2000));
    }
    pending();
}
check();
</script>
</body>
</html>
